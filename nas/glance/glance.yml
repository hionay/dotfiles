# Glance dashboard for hio-nas.
# Every env var referenced below must exist in glance's environment (see .env.example),
# glance refuses to start on a missing one.
#
# glance calls same-network containers by name; NAS_HOST is used for links
# and images opened in the browser.

server:
  port: 8080

theme:
  # Glance's default palette; the previous teal look is in the theme picker.
  presets:
    teal:
      background-color: 225 14 15
      primary-color: 157 47 65
      contrast-multiplier: 1.1

# Follow the OS light/dark setting. Glance only switches theme through its
# picker (POST /api/set-theme/<key>, remembered in a cookie), so do the same
# whenever the page's scheme doesn't match. A dark preset picked by hand (teal)
# is kept while the OS is dark.
document:
  head: |
    <script>
    (() => {
      const light = matchMedia("(prefers-color-scheme: light)");
      const sync = async () => {
        const want = light.matches ? "light" : "dark";
        const html = document.documentElement;
        if (html.dataset.scheme === want) return;
        const key = want === "light" ? "default-light" : "default";
        const res = await fetch(pageData.baseURL + "/api/set-theme/" + key, { method: "POST" });
        if (!res.ok) return;
        document.getElementById("theme-style").textContent = await res.text();
        html.dataset.theme = key;
        html.dataset.scheme = want;
        pageData.theme = key;
      };
      sync();
      light.addEventListener("change", sync);
    })();
    </script>

# Shared by the three "Upcoming" widgets on the Media page.
x-arr-releases-template: &arr-releases |
      {{ $collapseAfter := .Options.IntOr "collapse-after" 5 }}
      {{ $showGrabbed := .Options.BoolOr "show-grabbed" false }}
      {{ $sortTime := .Options.StringOr "sort-time" "desc" }}
      {{ $coverProxy := .Options.StringOr "cover-proxy" "" }}
      {{ $size := .Options.StringOr "size" "medium" }}
      {{ $service := .Options.StringOr "service" "" }}
      {{ $type := .Options.StringOr "type" "" }}
      {{ $intervalH := .Options.IntOr "interval" 0 | mul 24 }}

      {{ $now := now | formatTime "2006-01-02T15:04:05" }}
      {{ $posInterval := (offsetNow (printf "+%dh" $intervalH)) | formatTime "2006-01-02T15:04:05" }}
      {{ $negInterval := (offsetNow (printf "-%dh" $intervalH)) | formatTime "2006-01-02T15:04:05" }}

      {{ $apiBaseUrl := .Options.StringOr "api-base-url" "" }}
      {{ $key := .Options.StringOr "key" "" }}
      {{ $url := .Options.StringOr "url" $apiBaseUrl }}

      {{ if or (and (ne $service "sonarr") (ne $service "radarr") (ne $service "lidarr"))
               (and (ne $type "upcoming") (ne $type "recent") (ne $type "missing")) 
               (eq $apiBaseUrl "") (eq $key "") (eq $url "") }}
        <div class="widget-error-header">
            <div class="color-negative size-h3">ERROR</div>
            <svg class="widget-error-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"></path>
            </svg>
          </div>
          <p class="break-all">
            Some options are not set or malformed
              <table style="border-spacing: 1rem;">
                <tr><td>service</td><td>{{ $service }}</td><td>must be sonarr, radarr, or lidarr</td></tr>
                <tr><td>type</td><td>{{ $type }}</td><td>must be upcoming, recent, or missing</td></tr>
                <tr><td>api-base-url</td><td>{{ $apiBaseUrl }}</td><td>should include http(s):// and port if needed</td></tr>
                <tr><td>key</td><td>{{ $key }}</td><td></td></tr>
              </table> 
          </p>
      {{ else }}
        {{ $requestUrl := "" }}
  
        {{ if eq $service "sonarr" }}
          {{ if eq $type "recent" }}
            {{ $requestUrl = printf "%s/api/v3/history/since?includeSeries=true&includeEpisode=true&eventType=grabbed&date=%s" $apiBaseUrl $negInterval }}
          {{ else if eq $type "missing" }}
            {{ $requestUrl = printf "%s/api/v3/wanted/missing?page=1&pageSize=50&includeSeries=true" $apiBaseUrl }}
          {{ else if eq $type "upcoming" }}
            {{ $requestUrl = printf "%s/api/v3/calendar?includeSeries=true&start=%s&end=%s" $apiBaseUrl $now $posInterval }}
          {{ end }}
        
        {{ else if eq $service "radarr" }}
          {{ if eq $type "recent" }}
            {{ $requestUrl = printf "%s/api/v3/history/since?includeMovie=true&eventType=grabbed&date=%s" $apiBaseUrl $negInterval }}
          {{ else if eq $type "missing" }}
            {{ $requestUrl = printf "%s/api/v3/wanted/missing?page=1&pageSize=50" $apiBaseUrl }}
          {{ else if eq $type "upcoming" }}
            {{ $requestUrl = printf "%s/api/v3/calendar?start=%s&end=%s" $apiBaseUrl $now $posInterval }}
          {{ end }}
        
        {{ else if eq $service "lidarr" }}
          {{ if eq $type "recent" }}
            {{ $requestUrl = printf "%s/api/v1/history/since?includeArtist=true&includeAlbum=true&eventType=grabbed&date=%s" $apiBaseUrl $negInterval }}
          {{ else if eq $type "missing" }}
            {{ $requestUrl = printf "%s/api/v1/wanted/missing?page=1&pageSize=50&includeArtist=true" $apiBaseUrl }}
          {{ else if eq $type "upcoming" }}
            {{ $requestUrl = printf "%s/api/v1/calendar?includeArtist=true&start=%s&end=%s" $apiBaseUrl $now $posInterval }}
          {{ end }}
        {{ end }}
  
        {{ $data := newRequest $requestUrl
          | withHeader "Accept" "application/json"
          | withHeader "X-Api-Key" $key
          | getResponse }}
  
        <ul class="list list-gap-14 collapsible-container single-line-titles" data-collapse-after="{{ $collapseAfter }}">
          {{ $array := "" }}
          {{ $sortByField := "" }}
          {{ $itemDisplayed := false }}
          {{ $itemDate := "" }}
          {{ $isAvailable := false }}
  
          {{ if eq $type "missing" }}
            {{ $array = "records" }}
            {{ if eq $service "sonarr" }}
              {{ $sortByField = "airDateUtc" }}
            {{ else }}
              {{ $sortByField = "releaseDate" }}
            {{ end }}
          {{ else if eq $type "recent" }}
            {{ $sortByField = "date" }}
          {{ else }}
            {{ if eq $service "sonarr" }}
              {{ $sortByField = "airDateUtc" }}
            {{ else }}
              {{ $sortByField = "releaseDate" }}
            {{ end }}
          {{ end }}
  
          {{ range $data.JSON.Array $array | sortByTime $sortByField "rfc3339" $sortTime }}
           
            {{ if eq $service "sonarr" }}
              {{ $itemDate = .String "airDateUtc" | parseTime "RFC3339" }}
              {{ $itemDate = $itemDate.In now.Location | formatTime "2006-01-02T15:04:05" }}
              {{ $isAvailable = true }}
            {{ else if eq $service "radarr"}}
              {{ $isAvailable = .Bool "isAvailable" }}
              {{ $itemDate = .String "releaseDate" }}
            {{ else if eq $service "lidarr"}}
              {{ $itemDate = .String "releaseDate" }}
              {{ $isAvailable = true }}
            {{ end }}
  
            {{ if or (eq $type "upcoming") (eq $type "recent") (and (or (and (gt $itemDate $negInterval) ((lt $itemDate $now ))) (eq $intervalH 0))  $isAvailable) }}
              {{ $itemDisplayed = true }}
              {{ $title := "" }}
              {{ $subtitle := "" }}
              {{ $coverUrl := "" }}
              {{ $status := "" }}
              {{ $coverBase := "" }}
              {{ $height := "" }}
              {{ $width := "" }}
              {{ $popoverTitle := "" }}
              {{ $popoverSubtitle := "" }}
              {{ $popoverSummary := "" }}
              {{ $summary := "" }}
              {{ $link := "" }}
              {{ $grabbed := false }}
              {{ $date := now }}
              {{ $datetype := "" }}
              {{ $seString := "" }}
              {{ $genres := "" }}
              {{ $buttonJustify := "left" }}
  
    
              {{ if eq $service "sonarr" }}
                {{ $series := "" }}
                {{ if eq $coverProxy "" }}
                  {{ $coverBase = printf "%s/api/v3/mediacover" $url }}
                  {{ $coverUrl = printf "%s/%s/poster-500.jpg?apikey=%s" $coverBase (.String "seriesId") $key }}
                {{ else }}
                  {{ $coverBase = $coverProxy }}
                  {{ $coverUrl = printf "%s/%s/poster-500.jpg" $coverBase (.String "seriesId") }}
                {{ end }}
                {{ $title = .String "series.title" }}
                {{ $link = printf "%s/series/%s#" $url (.String "series.titleSlug") }}
                {{ $series = .Get "series" }}
                {{ $genres = $series.Get "genres" }}
             
                {{ if eq $type "recent" }}
                  {{ $date = .String "date" | parseLocalTime "RFC3339" }}
                  {{ $date = $date.In now.Location }}
                  {{ $subtitle = .String "episode.title" }}
                  {{ $summary = .String "episode.overview" }}
                  {{ $seString = printf "S%02dE%02d" (.Int "episode.seasonNumber") (.Int "episode.episodeNumber") }}
                  {{ $datetype = "Downloaded" }}
        
                  {{ if $showGrabbed }}
                    {{ $popoverTitle = .String "episode.title" }}
                    {{ $popoverSubtitle = $seString }}
                    {{ $popoverSummary = .String "episode.overview" }}
                    {{ if .Bool "episode.hasFile" }}
                      {{ $grabbed = true }}
                    {{ end }}
                  {{ else }}
                    {{ $popoverTitle = .String "series.title" }}
                    {{ $popoverSummary = .String "series.overview" }}
                  {{ end }}
    
                {{ else if eq $type "missing" }}
                  {{ $date = .String "airDateUtc" | parseLocalTime "RFC3339" }}
                  {{ $date = $date.In now.Location }}
                  {{ $subtitle = .String "title" }}
                  {{ $summary = .String "overview" }}
                  {{ $seString = printf "S%02dE%02d" (.Int "seasonNumber") (.Int "episodeNumber") }}
                  {{ $datetype = "Aired" }}
                  {{ if $showGrabbed }}
                    {{ $popoverTitle = .String "title" }}
                    {{ $popoverSubtitle = $seString }}
                    {{ $popoverSummary = .String "overview" }}
                    {{ if .Bool "episode.hasFile" }}
                      {{ $grabbed = true }}
                    {{ end }}
                  {{ else }}
                    {{ $popoverTitle = .String "series.title" }}
                    {{ $popoverSummary = .String "series.overview" }}
                  {{ end }}
                {{ else if eq $type "upcoming" }}
                  {{ $date = .String "airDateUtc" | parseLocalTime "RFC3339" }}
                  {{ $date = $date.In now.Location }}
                  {{ $subtitle = .String "title" }}
                  {{ $summary = .String "overview" }}
                  {{ $seString = printf "S%02dE%02d" (.Int "seasonNumber") (.Int "episodeNumber") }}
                  {{ $datetype = "Airs" }}
                  {{ if $showGrabbed }}
                    {{ $popoverTitle = .String "title" }}
                    {{ $popoverSubtitle = $seString }}
                    {{ $popoverSummary = .String "overview" }}
                    {{ if .Bool "hasFile" }}
                      {{ $grabbed = true }}
                    {{ end }}
                  {{ else }}
                    {{ $popoverTitle = .String "series.title" }}
                    {{ $popoverSummary = .String "series.overview" }}
                  {{ end }}
                {{ end }}
        
        
              {{ else if eq $service "radarr" }}
                {{ $movie := "" }}
                {{ $status = .String "status" }}
                {{ if eq $coverProxy "" }}
                  {{ $coverBase = printf "%s/api/v3/mediacover" $url }}
                {{ else }}
                  {{ $coverBase = $coverProxy }}
                {{ end }}
                {{ if eq $status "announced"}}
                  {{ if ne (.String "inCinemas") "" }}
                    {{ $date = (.String "inCinemas" | parseTime "RFC3339") }}
                    {{ $datetype = "In Cinemas" }}
                  {{ else }}
                    {{ $date = (.String "releaseDate" | parseTime "RFC3339") }}
                    {{ $datetype = "Releases" }}
                  {{ end }}
                {{ else if eq $status "inCinemas"}}
                  {{ $date = (.String "releaseDate" | parseTime "RFC3339") }}
                  {{ $datetype = "Releases" }}
                {{ else if eq $status "released"}}
                  {{ $date = (.String "releaseDate" | parseTime "RFC3339") }}
                  {{ $datetype = "Released" }}
                {{ end }}
   
                {{ if eq $type "recent" }}
                  {{ if eq $coverProxy "" }}
                    {{ $coverUrl = printf "%s/%s/poster-500.jpg?apikey=%s" $coverBase (.String "movie.id") $key }}
                  {{ else }}
                    {{ $coverUrl = printf "%s/%s/poster-500.jpg" $coverBase (.String "movie.id") }}
                  {{ end }}
                  {{ $datetype = "Downloaded" }}
                  {{ $date = (.String "date" | parseTime "RFC3339") }}
                  {{ $title = .String "movie.title" }}
                  {{ $subtitle = "" }}
                  {{ $summary = .String "movie.overview" }}
                  {{ $popoverTitle = .String "movie.title" }}
                  {{ $popoverSubtitle = printf "%s %s" $datetype ($date | formatTime "1/2/2006") }}
                  {{ $popoverSummary = .String "movie.overview" }}
                  {{ $link = printf "%s/movie/%s#" $url (.String "movie.titleSlug") }}
                  {{ $movie = .Get "movie" }}
                  {{ $genres = $movie.Get "genres" }}
                  {{ if and $showGrabbed (gt (.Int "movie.movieFileId") 0) }}
                    {{ $grabbed = true }}
                  {{ end }}
                {{ else }}
                  {{ if eq $coverProxy "" }}
                    {{ $coverUrl = printf "%s/%s/poster-500.jpg?apikey=%s" $coverBase (.String "id") $key }}
                  {{ else }}
                    {{ $coverUrl = printf "%s/%s/poster-500.jpg" $coverBase (.String "id") }}
                  {{ end }}
                  {{ $title = .String "title" }}
                  {{ $subtitle = "" }}
                  {{ $summary = .String "overview" }}
                  {{ $link = printf "%s/movie/%s#" $url (.String "titleSlug") }}
                  {{ $popoverTitle = .String "title" }}
                  {{ $popoverSubtitle = printf "%s %s" $datetype ($date | formatTime "1/2/2006") }}
                  {{ $popoverSummary = .String "overview" }}
                  {{ $genres = .Get "genres" }}
                  {{ if eq $type "missing" }}
                    {{ if and $showGrabbed (.Bool "movie.hasFile") }}
                      {{ $grabbed = true }}
                    {{ end }}
                  {{ else }}
                    {{ if and $showGrabbed (.Bool "hasFile") }}
                      {{ $grabbed = true }}
                    {{ end }}
                  {{ end }}
                {{ end }}
  
        
              {{ else if eq $service "lidarr" }}
                {{ $artist := "" }}
                {{ $album := "" }}
                {{ $albumId := "" }}
                {{ if eq $coverProxy "" }}
                  {{ $coverBase = printf "%s/api/v1/mediacover" $url }}
                {{ else }}
                  {{ $coverBase = $coverProxy }}
                {{ end }}
   
                {{ if eq $type "recent" }}
                  {{ $album = .Get "album" }}
                  {{ $artist = $album.Get "artist" }}
                  {{ if eq $coverProxy "" }}
                    {{ $coverUrl = printf "%s/album/%s/cover-500.jpg?apikey=%s" $coverBase (.String "albumId") $key }}
                  {{ else }}
                    {{ $coverUrl = printf "%s/album/%s/cover-500.jpg" $coverBase (.String "albumId") }}
                  {{ end }}
                  {{ $grabbed = true }}
                  {{ $title = $album.String "title" }}
                  {{ $date = (.String "date" | parseTime "RFC3339") }}
                  {{ $datetype = "Downloaded" }}
                  {{ $subtitle = $artist.String "artistName" }}
                  {{ $genres = $artist.Get "genres" }}
                  {{ $link = printf "%s/artist/%s#" $url ($artist.String "foreignArtistId") }}
                  {{ $summary = $album.String "overview" }}
                  {{ $popoverTitle = $album.String "title" }}
                  {{ $popoverSubtitle = printf "%s %s" $datetype ($date | formatTime "1/2/2006") }}
                  {{ $popoverSummary = $artist.String "overview" }}
  
                {{ else }}
                  {{ $artist = .Get "artist" }}
                  {{ $album = .Get "album" }}
                  {{ if eq $type "missing" }}
                    {{ $datetype = "Released" }}
                  {{ else }}
                    {{ $datetype = "Releases" }}
                  {{ end }}
                  {{ range .Array "releases" }}
                    {{ $albumId = .String "albumId" }}
                    {{ break }}
                  {{ end }}
                  {{ if eq $coverProxy "" }}
                    {{ $coverUrl = printf "%s/album/%s/cover-500.jpg?apikey=%s" $coverBase $albumId $key }}
                  {{ else }}
                    {{ $coverUrl = printf "%s/album/%s/cover-500.jpg" $coverBase $albumId }}
                  {{ end }}
                  {{ $date = (.String "releaseDate" | parseTime "RFC3339") }}
                  {{ $title = .String "title" }}
                  {{ $subtitle = $artist.String "artistName" }}
                  {{ $summary = $album.String "overview" }}
                  {{ $genres = $artist.Get "genres" }}
                  {{ $link = printf "%s/artist/%s#" $url ($artist.String "foreignArtistId") }}
                  {{ $popoverTitle = .String "title" }}
                  {{ $popoverSubtitle = printf "%s %s" $datetype ($date | formatTime "1/2/2006") }}
                  {{ $popoverSummary = .String "artist.overview" }}
                {{ end }}
              {{ end }}
        
              {{ if eq $size "small" }}
                {{ $buttonJustify = "right" }}
                {{ $height = "9rem" }}
                {{ if eq $service "lidarr" }}
                  {{ $width = "9rem" }}
                {{ else }}
                  {{ $width = "6rem" }}
                {{ end }}
              {{ else if eq $size "medium" }}
                {{ $height = "12rem" }}
                {{ if eq $service "lidarr" }}
                  {{ $width = "12rem" }}
                {{ else }}
                  {{ $width = "8rem" }}
                {{ end }}
              {{ else if eq $size "large" }} 
                {{ $height = "15rem" }}
                {{ if eq $service "lidarr" }}
                  {{ $width = "15rem" }}
                {{ else }}
                  {{ $width = "10rem" }}
                {{ end }}
              {{ else if eq $size "huge" }} 
                {{ $height = "18rem" }}
                {{ if eq $service "lidarr" }}
                  {{ $width = "18rem" }}
                {{ else }}
                  {{ $width = "12rem" }}
                {{ end }}
              {{ end }}
    
              <li style="position: relative;">
                <div class="flex gap-10 items-start thumbnail-container thumbnail-parent">
                  <div>
                    <div data-popover-type="html" data-popover-position="above" data-popover-show-delay="500" style="width: {{ $width  }}; height: {{ $height }}; align-content: center;">
                      <div data-popover-html>
                        <div style="margin: 5px;">
                          <strong class="size-h4 color-primary" title="{{ $popoverTitle }}">{{ $popoverTitle }}</strong>
                          <div class="size-h4 text-truncate text-very-compact color-subdue" title="{{ $popoverSubtitle }}">{{ $popoverSubtitle }}</div>
                          <p class="margin-top-20" style="overflow-y: auto; text-align: justify; max-height: 20rem;">
                            {{ if ne $popoverSummary "" }}
                              {{ $popoverSummary }}
                            {{ else }}
                              TBA
                            {{ end }}
                          </p>
                         {{ if gt (len ($genres.Array "")) 0 }}
                          <ul class="attachments margin-top-20">
                            {{ range $genres.Array "" }}
                              <li>{{ .String "" }}</li>
                            {{ end }}
                          </ul>
                          {{ end }}
                        </div>
                      </div>
                      <img class="thumbnail" src="{{ $coverUrl }}" alt="Cover for {{ .String "title" }}" loading="lazy" style="width: 100%; height: 100%; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1); object-fit: cover; border-radius: 0.5rem;">
                    </div>
                </div>
                  <div class="shrink min-width-0" style="height: 9rem; position: relative; padding-top: 5px; padding-right: 5px;">
                    <strong class="size-h4 block text-truncate color-primary" title="{{ $title }}">{{ $title }}</strong>
                    <div class="text-truncate text-very-compact" title="{{ $subtitle }}">{{ $subtitle }}</div>
                    <div class="text-very-compact text-truncate">
                      {{ if eq $service "sonarr" }}
                        <div>{{ $seString }} - {{ $datetype }} {{ $date.Format "1/2 03:04PM" }}</div>
                      {{ else }}
                        <span>{{ $datetype }} {{ $date.Format "1/2" }}</span>
                      {{ end }}
                    </div>
    
                    {{ if $showGrabbed }}
                      {{ if eq $buttonJustify "right" }}
                        </div>
                        <a href="{{ $link }}" class="bookmarks-link size-h4 color-primary" target="_blank" rel="noreferrer"
                          style="position: absolute; bottom: 1rem; right: 1rem;
                            {{ if $grabbed }} color: var(--color-positive); border: 1px solid var(--color-positive); {{ else }} color: var(--color-negative); border: 1px solid var(--color-negative); {{ end }}
                            font-weight: bold; padding: 2px 5px; border-radius: 3px; display: inline-block; margin-top: 5px; text-decoration: none;">
                        {{ if $grabbed }}Grabbed{{ else }}Missing{{ end }}
                        </a>
                      {{ else }}
                        <a href="{{ $link }}" class="bookmarks-link size-h4 color-primary" target="_blank" rel="noreferrer"
                          style="{{ if $grabbed }} color: var(--color-positive); border: 1px solid var(--color-positive); {{ else }} color: var(--color-negative); border: 1px solid var(--color-negative); {{ end }}
                            font-weight: bold; padding: 2px 5px; border-radius: 3px; display: inline-block; margin-top: 5px; text-decoration: none;">
                        {{ if $grabbed }}Grabbed{{ else }}Missing{{ end }}
                        </a>
                        </div>
                      {{ end }}
                    {{ else }}
                      <div class="{{ if eq $size "small" }}text-truncate{{ if eq $service "radarr" }} margin-top-5{{ end }}{{ else }}text-truncate-2-lines margin-top-5{{ end }}">
                        {{ $summary }}
                      </div>
                    {{ end }}
                </div>
              </li>
            {{ end }}
          {{ end }}
          {{ if not $itemDisplayed }}
            <li>No items found.</li>
          {{ end }}
        </ul>
      {{ end }}

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h

          - type: weather
            location: ${WEATHER_LOCATION}
            units: metric
            hour-format: 24h

          - type: server-stats
            servers:
              - type: local
                name: hio-nas

          # Reachable through the adguard-shim macvlan task on the NAS.
          - type: dns-stats
            title: AdGuard DNS
            service: adguard
            url: ${ADGUARD_URL}
            username: ${ADGUARD_USERNAME}
            password: ${ADGUARD_PASSWORD}
            hide-graph: true
            hide-top-domains: true

          - type: custom-api
            title: "Drive Health"
            url: http://scrutiny:8080/api/summary
            cache: 1h
            method: GET
            options:
              filter_archived: true
              sort_by: "device.device_name"
              sort_order: "asc"
            template: |
              {{- $filterArchived := .Options.filter_archived }}
              {{- $sortBy := .Options.sort_by }}
              {{- $sortOrder := .Options.sort_order }}
              {{- /* Convert summary map into array so we can sort */}}
              {{- $drives := .JSON.Array "data.summary|@values" }}
              {{- /* Sort drives by given string field */}}
              {{- $sorted := $drives }}
              {{- if or (eq $sortBy "device.capacity") (eq $sortBy "smart.power_on_hours") }}
                {{- $sorted = sortByInt $sortBy $sortOrder $drives }}
              {{- else }}
                {{- $sorted = sortByString $sortBy $sortOrder $drives }}
              {{- end }}
              {{- $total := 0 }}
              {{- range $sorted }}
                {{- $archived := .Get "device.archived" }}
                {{- $archivedBool := false }}
                {{- if $archived }}
                  {{- $archivedBool = eq $archived.Raw "true" }}
                {{- end }}
                {{- if and $filterArchived $archivedBool }}{{- continue }}{{- end }}
                {{- $total = add $total 1 }}
              {{- end }}
              {{- /* Output each drive */}}
              {{- $count := 0 }}
              {{- range $sorted }}
                {{- $archived := .Get "device.archived" }}
                {{- $archivedBool := false }}
                {{- if $archived }}
                  {{- $archivedBool = eq $archived.Raw "true" }}  {{/* compare raw JSON to string "true" */}}
                {{- end }}
                {{- /* Skip archived drives if filter is on */}}
                {{- if and $filterArchived $archivedBool }}{{- continue }}{{- end }}
                {{- $count = add $count 1 }}
                {{- $device := .Get "device" }}
                {{- $deviceName := $device.String "device_name" }} 
                {{- $model := $device.String "model_name" }}
                {{- $wwn := $device.String "wwn" }}
                {{- $days := printf "%.0f" (div (.Get "smart.power_on_hours").Num 24) }}
                {{- $capacity_print := printf "%.0f" (div (.Get "device.capacity").Num 1000000000000) }}
                {{- $status := (.Get "device.device_status").Num }}
                {{- $tempHistory := .Array "temp_history" }}
                {{- $latestTemp := index (.Array "temp_history") (sub (len (.Array "temp_history")) 1) }}
                {{- $latestTempValue := $latestTemp.Int "temp" }}
                <div style="margin-top: 1rem; display: flex; justify-content: space-between; align-items: center;">
                  <a href="http://${NAS_HOST}:6090/web/device/{{ $wwn }}" target="_blank">
                    <div>
                      <strong class="color-highlight" style="text-transform: uppercase; font-size: 1.5rem;">
                        /DEV/{{ $deviceName }} &#xb7; {{ $capacity_print }}TB &#xb7; {{ $latestTempValue }}&#xb0;C
                      </strong><br>
                      <p class="color-highlight" style="margin: 0;">{{ $model }}</p>
                      <div class="color-primary" style="font-size: 1.2rem;">Powered on for {{ $days }} days</div>
                    </div>
                  </a>
                  <div style="display: flex; align-items: center; gap: 6px;">
                    {{- if eq $status 0.0 }}
                      <span title="Passed Health Checks" style="font-size: 18px;cursor: default;" class="color-positive">&#x25cf;</span>
                    {{- else }}
                      <span title="Failed Health Checks" style="font-size: 18px;cursor:default;" class="color-negative">&#x25cf;</span>
                    {{- end }}
                  </div>
                </div>
                {{- if lt $count $total }}
                  <hr class="color-secondary" style="margin: 1rem 0; border: none; border-bottom: 1px solid currentColor;" />
                {{- end }}
              {{- end }}

      - size: full
        widgets:
          - type: monitor
            title: Personal Projects
            cache: 1m
            sites:
              - title: Quit Vaping
                url: https://quit-vaping.halil.io
                check-url: http://quit-vaping:8787
                timeout: 10s
                icon: si:checkmarx
              - title: Quotes
                url: https://quotes.halil.io
                check-url: http://quotes:8080
                timeout: 10s
                icon: si:quora
              - title: RubyChan
                url: https://github.com/hionay/rubychan
                check-url: http://rubychan:8080/webhook
                timeout: 10s
                icon: si:matrix
                alt-status-codes: [405]

          - type: monitor
            title: Server Services
            cache: 1m
            sites:
              - title: AdGuard Home
                url: http://adguardhome
                check-url: ${ADGUARD_URL}
                timeout: 10s
                icon: di:adguard-home
              - title: Bazarr
                url: http://${NAS_HOST}:6767
                check-url: http://bazarr:6767
                timeout: 10s
                icon: di:bazarr
              - title: Dockhand
                url: http://${NAS_HOST}:4000
                check-url: http://${NAS_IP}:4000
                timeout: 10s
                icon: si:docker
              - title: Lidarr
                url: http://${NAS_HOST}:8686
                check-url: http://lidarr:8686/ping
                timeout: 10s
                icon: di:lidarr
              - title: Miniflux
                url: http://${NAS_HOST}:8071
                check-url: http://miniflux:8080/healthcheck
                timeout: 10s
                icon: di:miniflux
              - title: Pinchflat
                url: http://${NAS_HOST}:8945
                check-url: http://pinchflat:8945/healthcheck
                timeout: 10s
                icon: si:youtube
              - title: Plex
                url: http://${NAS_HOST}:32400/web
                check-url: http://${NAS_IP}:32400/identity
                timeout: 10s
                icon: di:plex
              - title: Profilarr
                url: http://${NAS_HOST}:6868
                check-url: http://profilarr:6868
                timeout: 10s
                icon: di:profilarr
              - title: Prowlarr
                url: http://${NAS_HOST}:9696
                check-url: http://prowlarr:9696/ping
                timeout: 10s
                icon: di:prowlarr
              - title: Pulsarr
                url: http://${NAS_HOST}:3003
                check-url: http://pulsarr:3003
                timeout: 10s
                icon: di:pulsarr
                alt-status-codes: [404]
              - title: qBittorrent
                url: http://${NAS_HOST}:8090
                check-url: http://qbittorrent:8090
                timeout: 10s
                icon: di:qbittorrent
              - title: Radarr
                url: http://${NAS_HOST}:7878
                check-url: http://radarr:7878/ping
                timeout: 10s
                icon: di:radarr
              - title: Scrutiny
                url: http://${NAS_HOST}:6090
                check-url: http://scrutiny:8080
                timeout: 10s
                icon: di:scrutiny
              - title: Sonarr
                url: http://${NAS_HOST}:8989
                check-url: http://sonarr:8989/ping
                timeout: 10s
                icon: di:sonarr
              - title: Tautulli
                url: http://${NAS_HOST}:8181
                check-url: http://tautulli:8181
                timeout: 10s
                icon: di:tautulli
              - title: Trawl
                url: http://${NAS_HOST}:8191/dashboard
                check-url: http://trawl:8191/health
                timeout: 10s
                icon: di:flaresolverr

          # split-column deals widgets round-robin (left, right, left, ...), so
          # this order gives: left = Plex, right = downloads/containers/tunnel.
          - type: split-column
            widgets:
              # Library sections 1 and 2 are assumed to be Movies and TV Shows.
              - type: custom-api
                title: Plex Activity
                cache: 2s
                url: http://${NAS_IP}:32400/status/sessions
                headers:
                  Accept: application/json
                  X-Plex-Token: ${PLEX_TOKEN}
                subrequests:
                  movies:
                    url: http://${NAS_IP}:32400/library/sections/1/all?X-Plex-Container-Start=0&X-Plex-Container-Size=0
                    headers:
                      Accept: application/json
                      X-Plex-Token: ${PLEX_TOKEN}
                  shows:
                    url: http://${NAS_IP}:32400/library/sections/2/all?X-Plex-Container-Start=0&X-Plex-Container-Size=0
                    headers:
                      Accept: application/json
                      X-Plex-Token: ${PLEX_TOKEN}
                  server:
                    url: http://${NAS_IP}:32400/
                    headers:
                      Accept: application/json
                      X-Plex-Token: ${PLEX_TOKEN}
                template: |
                  {{- $activeStreams := .JSON.Int "MediaContainer.size" -}}
                  <div class="flex justify-between text-center">
                    <div>
                      <div class="{{ if gt $activeStreams 0 }}color-positive{{ else }}color-highlight{{ end }} size-h3">{{ $activeStreams }}</div>
                      <div class="size-h6{{ if gt $activeStreams 0 }} color-positive{{ end }}">SESSIONS</div>
                    </div>
                    <div>
                      <div class="color-highlight size-h3">{{ (.Subrequest "movies").JSON.Int "MediaContainer.totalSize" }}</div>
                      <div class="size-h6">MOVIES</div>
                    </div>
                    <div>
                      <div class="color-highlight size-h3">{{ (.Subrequest "shows").JSON.Int "MediaContainer.totalSize" }}</div>
                      <div class="size-h6">SHOWS</div>
                    </div>
                  </div>
                  {{ if gt $activeStreams 0 }}
                  <div class="margin-top-10">
                    {{ range .JSON.Array "MediaContainer.Metadata" }}
                      <div class="flex justify-between align-center margin-top-5">
                        <span class="size-p color-highlight text-truncate" style="max-width: 65%;">{{ .String "title" }}</span>
                        <span class="size-h6 color-positive">{{ .String "User.title" }}</span>
                      </div>
                    {{ end }}
                  </div>
                  {{ else }}
                  <div class="text-center margin-top-10">
                    <span class="size-h6 color-subdue">{{ (.Subrequest "server").JSON.String "MediaContainer.friendlyName" }}</span>
                  </div>
                  {{ end }}

              # Needs Tools > Options > Web UI > "Bypass authentication for clients
              # in whitelisted IP subnets" with 172.20.0.0/16 in qBittorrent.
              - type: custom-api
                title: Downloads
                cache: 10s
                options:
                  view: "basic"   # "basic" or "detailed"
                  mode: "upload"    # "default" or "upload"
                subrequests:
                  transfer:
                    url: http://qbittorrent:8090/api/v2/transfer/info
                  seeding:
                    url: http://qbittorrent:8090/api/v2/torrents/info
                    parameters:
                      filter: seeding
                  leeching:
                    url: http://qbittorrent:8090/api/v2/torrents/info
                    parameters:
                      filter: downloading
                template: |
                  {{ $transfer := .Subrequest "transfer" }}
                  {{ $seeding := .Subrequest "seeding" }}
                  {{ $leeching := .Subrequest "leeching" }}

                  {{ if and (eq $transfer.Response.StatusCode 200) (eq $seeding.Response.StatusCode 200) (eq $leeching.Response.StatusCode 200) }}

                    {{ $isDetailed := eq (.Options.StringOr "view" "detailed") "detailed" }}
                    {{ $mode := .Options.StringOr "mode" "default" }}

                    {{ if $isDetailed }}
                    <!-- Detailed View -->
                    <div class="list" style="--list-gap: 15px;">
                      <div class="flex justify-between text-center">
                        <div>
                          {{ $dlSpeed := $transfer.JSON.Float "dl_info_speed" }}
                          {{ if eq $mode "upload" }}
                            <div class="color-highlight size-h3">{{ printf "%.1f MB/s" (div $dlSpeed 1000000.0) }}</div>
                          {{ else }}
                            {{ if lt $dlSpeed 1048576.0 }}
                              <div class="color-highlight size-h3">{{ printf "%.0f KiB/s" (div $dlSpeed 1024.0) }}</div>
                            {{ else }}
                              <div class="color-highlight size-h3">{{ printf "%.1f MiB/s" (div $dlSpeed 1048576.0) }}</div>
                            {{ end }}
                          {{ end }}
                          <div class="size-h6">DOWNLOADING</div>
                        </div>

                        {{ if eq $mode "upload" }}
                        <div>
                          {{ $ulSpeed := $transfer.JSON.Float "up_info_speed" }}
                          <div class="color-highlight size-h3">{{ printf "%.1f MB/s" (div $ulSpeed 1000000.0) }}</div>
                          <div class="size-h6">UPLOADING</div>
                        </div>
                        {{ end }}

                        <div>
                          <div class="color-highlight size-h3">{{ len ($seeding.JSON.Array "") }}</div>
                          <div class="size-h6">SEEDING</div>
                        </div>

                        {{ if eq $mode "default" }}
                        <div>
                          <div class="color-highlight size-h3">{{ len ($leeching.JSON.Array "") }}</div>
                          <div class="size-h6">LEECHING</div>
                        </div>
                        {{ end }}
                      </div>

                      <!-- Downloading list -->
                      {{ $downloadingTorrents := $leeching.JSON.Array "" }}
                      {{ if gt (len $downloadingTorrents) 0 }}
                        <div style="margin-top: 15px;">
                          <ul class="list collapsible-container" data-collapse-after="0" style="--list-gap: 15px;">
                            {{ range $t := $downloadingTorrents }}
                              {{ $state := $t.String "state" }}
                              {{ $icon := "?" }}
                              {{ if ge ($t.Int "completed") ($t.Int "size") }}{{ $icon = "\u2714" }}
                              {{ else if eq $state "downloading" "forcedDL" }}{{ $icon = "\u2193" }}
                              {{ else if eq $state "pausedDL" "stoppedDL" "pausedUP" "stalledDL" "stalledUP" "queuedDL" "queuedUP" }}{{ $icon = "\u275a\u275a" }}
                              {{ else if eq $state "error" "missingFiles" }}{{ $icon = "!" }}
                              {{ else if eq $state "checkingDL" "checkingUP" "allocating" }}{{ $icon = "\u2026" }}
                              {{ else if eq $state "checkingResumeData" }}{{ $icon = "\u27f3" }}
                              {{ end }}

                              <li class="flex items-center" style="gap: 10px;">
                                <div class="size-h4" style="flex-shrink: 0;">{{ $icon }}</div>
                                <div style="flex-grow: 1; min-width: 0;">
                                  <div class="text-truncate color-highlight">{{ $t.String "name" }}</div>
                                  <div title="{{ $t.Float "progress" | mul 100 | printf "%.1f" }}%" style="background: rgba(128, 128, 128, 0.2); border-radius: 5px; height: 6px; margin-top: 5px; overflow: hidden;">
                                    <div style="width: {{ $t.Float "progress" | mul 100 }}%; background-color: var(--color-positive); height: 100%; border-radius: 5px;"></div>
                                  </div>
                                </div>
                                <div style="flex-shrink: 0; text-align: right; width: 80px;">
                                  {{ $dlSpeed := $t.Float "dlspeed" }}
                                  <div class="size-sm color-paragraph">
                                    {{ if eq $mode "upload" }}
                                      {{ if lt $dlSpeed 1000.0 }}--{{ else }}{{ printf "%.1f MB/s" (div $dlSpeed 1000000.0) }}{{ end }}
                                    {{ else }}
                                      {{ if lt $dlSpeed 1024.0 }}--{{ else if lt $dlSpeed 1048576.0 }}{{ printf "%.0f KiB/s" (div $dlSpeed 1024.0) }}{{ else }}{{ printf "%.1f MiB/s" (div $dlSpeed 1048576.0) }}{{ end }}
                                    {{ end }}
                                  </div>
                                  {{ $eta := $t.Int "eta" }}
                                  <div class="size-sm color-paragraph">
                                    {{ if eq $eta 8640000 }}&#x221e;
                                    {{ else if gt $eta 3600 }}{{ printf "%dh %dm" (div $eta 3600) (mod (div $eta 60) 60) }}
                                    {{ else if gt $eta 0 }}{{ printf "%dm" (div $eta 60) }}
                                    {{ else }}--{{ end }}
                                  </div>
                                </div>
                              </li>
                            {{ end }}
                          </ul>
                        </div>
                      {{ end }}

                      <!-- Seeding list -->
                      {{ if eq $mode "upload" }}
                        {{ $seedingTorrents := $seeding.JSON.Array "" }}
                        {{ if gt (len $seedingTorrents) 0 }}
                          <div style="margin-top: 20px;">
                            <ul class="list collapsible-container" data-collapse-after="0" style="--list-gap: 15px;">
                              {{ range $t := $seedingTorrents }}
                                {{ $state := $t.String "state" }}
                                {{ $icon := "\u2191" }}
                                {{ if eq $state "pausedUP" "stoppedUP" "stalledUP" "queuedUP" }}{{ $icon = "\u275a\u275a" }}
                                {{ else if eq $state "error" "missingFiles" }}{{ $icon = "!" }}
                                {{ else if eq $state "checkingUP" }}{{ $icon = "\u2026" }}
                                {{ else if eq $state "checkingResumeData" }}{{ $icon = "\u27f3" }}
                                {{ end }}

                                <li class="flex items-center" style="gap: 10px;">
                                  <div class="size-h4" style="flex-shrink: 0;">{{ $icon }}</div>
                                  <div style="flex-grow: 1; min-width: 0;">
                                    <div class="text-truncate color-highlight">{{ $t.String "name" }}</div>
                                    <div class="size-sm color-paragraph">
                                      Ratio: {{ printf "%.2f" ($t.Float "ratio") }} | 
                                      Size: {{ printf "%.1f GB" (div ($t.Float "size") 1073741824.0) }}
                                    </div>
                                  </div>
                                  <div style="flex-shrink: 0; text-align: right; width: 80px;">
                                    {{ $ulSpeed := $t.Float "upspeed" }}
                                    <div class="size-sm color-paragraph">
                                      {{ if lt $ulSpeed 1000.0 }}--{{ else }}{{ printf "%.1f MB/s" (div $ulSpeed 1000000.0) }}{{ end }}
                                    </div>
                                    <div class="size-sm color-paragraph">Upload</div>
                                  </div>
                                </li>
                              {{ end }}
                            </ul>
                          </div>
                        {{ end }}
                      {{ end }}

                    </div>

                    {{ else }}
                    <!-- Basic View -->
                    <div class="flex justify-between text-center">
                      <div>
                        {{ $dlSpeed := $transfer.JSON.Float "dl_info_speed" }}
                        <div class="color-highlight size-h3">{{ printf "%.1f MB/s" (div $dlSpeed 1000000.0) }}</div>
                        <div class="size-h6">DOWNLOADING</div>
                      </div>
                      {{ if eq $mode "upload" }}
                      <div>
                        {{ $ulSpeed := $transfer.JSON.Float "up_info_speed" }}
                        <div class="color-highlight size-h3">{{ printf "%.1f MB/s" (div $ulSpeed 1000000.0) }}</div>
                        <div class="size-h6">UPLOADING</div>
                      </div>
                      {{ end }}
                      <div>
                        <div class="color-highlight size-h3">{{ len ($seeding.JSON.Array "") }}</div>
                        <div class="size-h6">SEEDING</div>
                      </div>
                      {{ if eq $mode "default" }}
                      <div>
                        <div class="color-highlight size-h3">{{ len ($leeching.JSON.Array "") }}</div>
                        <div class="size-h6">LEECHING</div>
                      </div>
                      {{ end }}
                    </div>
                    {{ end }}

                  {{ else }}
                    <div class="color-negative text-center">
                      <p>Error fetching qBittorrent data.</p>
                      <p class="size-sm">Check URL and authentication bypass settings.</p>
                    </div>
                  {{ end }}

              - type: custom-api
                title: Now Playing
                cache: 5m
                url: http://tautulli:8181/api/v2?apikey=${TAUTULLI_API_KEY}&cmd=get_activity
                template: |
                  {{ $sessions := .JSON.Array "response.data.sessions" }}
                  {{ $collapse := .Options.IntOr "collapse" 5 }}

                  {{ if eq (len $sessions) 0 }}
                    <div class="color-dim">No one is watching anything right now.</div>
                  {{ else }}
                    <ul class="list collapsible-container" data-collapse-after="{{ $collapse }}">
                      {{ range $session := $sessions }}
                        {{ $type := $session.String "media_type" }}
                        {{ $isEpisode := eq $type "episode" }}
                        {{ $isMovie := eq $type "movie" }}
                        {{ $thumb := "" }}
                        {{ $title := "" }}
                        {{ $subtitle := "" }}

                        {{ if $isEpisode }}
                          {{ $title = $session.String "grandparent_title" }}
                          {{ $subtitle = printf "S%02dE%02d - %s" ($session.Int "parent_media_index") ($session.Int "media_index") ($session.String "title") }}
                          {{ $thumb = $session.String "grandparent_thumb" }}
                        {{ else }}
                          {{ $title = $session.String "title" }}
                          {{ $thumb = $session.String "thumb" }}
                        {{ end }}

                        {{ $duration := $session.Int "duration" }}
                        {{ $offset := $session.Int "view_offset" }}
                        {{ $remaining := div (sub $duration $offset) 1000 }}
                        {{ $now := now }}
                        {{ $endTime := $now.Add (duration (printf "%ds" $remaining)) | formatTime "3:04PM" }}
                        {{ $ratingKey := $session.String "rating_key" }}

                        <li class="flex items-center gap-2" style="padding: 0.5rem 0; border-bottom: 1px solid var(--color-border);">
                          <a href="https://app.plex.tv/desktop/#!/server/${PLEX_SERVER_ID}/details?key=%2Flibrary%2Fmetadata%2F{{ $ratingKey }}"
                            title="{{ $session.String "summary" }}">
                            <img
                              src="http://${NAS_HOST}:8181/api/v2?apikey=${TAUTULLI_API_KEY}&cmd=pms_image_proxy&img={{ $thumb }}"
                              alt="thumb"
                              style="width: 50px; margin-right: 1.5rem; min-width: 50px;"
                              class="rounded object-cover"
                            />
                          </a>

                          <div class="min-width-0 grow">
                            <div class="color-highlight"
                              style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis;"
                              title="{{ $title }}">
                              {{ $title }}
                            </div>

                            {{ if $isEpisode }}
                              <div class="color-highlight" title="{{ $session.String "title" }}">
                                S{{ $session.Int "parent_media_index" }}&thinsp;&#xb7;&thinsp;E{{ $session.Int "media_index" }}
                              </div>
                            {{ else if $isMovie }}
                              <div class="color-highlight" title="{{ $session.String "summary" }}">
                                {{ $session.Int "year" }}
                              </div>
                            {{ end }}

                            <div class="color-primary">
                              <span title="{{ $session.String "player" }}">
                                {{ $session.String "friendly_name" }}
                              </span> &#x2022;
                              <span title="Ends at: {{ $endTime }}">
                                {{ $session.String "progress_percent" }}% watched
                              </span>
                            </div>
                          </div>
                        </li>
                      {{ end }}
                    </ul>
                  {{ end }}

              - type: custom-api
                title: Dockhand
                title-url: http://${NAS_HOST}:4000
                cache: 1h

                url: http://${NAS_IP}:4000/api/environments

                headers:
                  Authorization: Bearer ${DOCKHAND_API_TOKEN}

                subrequests:
                  containers:
                    url: http://${NAS_IP}:4000/api/containers?env=${DOCKHAND_ENV_ID}
                    headers:
                      Authorization: Bearer ${DOCKHAND_API_TOKEN}
                  images:
                    url: http://${NAS_IP}:4000/api/images?env=${DOCKHAND_ENV_ID}
                    headers:
                      Authorization: Bearer ${DOCKHAND_API_TOKEN}
                  networks:
                    url: http://${NAS_IP}:4000/api/networks?env=${DOCKHAND_ENV_ID}
                    headers:
                      Authorization: Bearer ${DOCKHAND_API_TOKEN}
                  volumes:
                    url: http://${NAS_IP}:4000/api/volumes?env=${DOCKHAND_ENV_ID}
                    headers:
                      Authorization: Bearer ${DOCKHAND_API_TOKEN}
                  stacks:
                    url: http://${NAS_IP}:4000/api/stacks?env=${DOCKHAND_ENV_ID}
                    headers:
                      Authorization: Bearer ${DOCKHAND_API_TOKEN}
                  updates:
                    url: http://${NAS_IP}:4000/api/containers/check-updates?env=${DOCKHAND_ENV_ID}
                    headers:
                      Authorization: Bearer ${DOCKHAND_API_TOKEN}

                template: |
                  {{ $envName := .JSON.String "#(id==${DOCKHAND_ENV_ID}).name" }}
                  {{ $iconStyle := "height: 1.5em; stroke: gray; fill: none; margin-bottom: 0.25em;" | safeCSS }}
                  {{ $iconStyleSmall := "height: 1.15em; stroke: gray; fill: none; margin-bottom: 0.25em;" | safeCSS }}

                  {{ $containers := (.Subrequest "containers").JSON.Array "" }}
                  {{ $images := (.Subrequest "images").JSON.Array "" }}
                  {{ $networks := (.Subrequest "networks").JSON.Array "" }}
                  {{ $volumes := (.Subrequest "volumes").JSON.Array "" }}
                  {{ $stacks := (.Subrequest "stacks").JSON.Array "" }}
                  {{ $pendingUpdates := (.Subrequest "updates").JSON.Array "pendingUpdates" }}

                  {{ $running := 0 }}
                  {{ $stopped := 0 }}
                  {{ $unhealthy := 0 }}
                  {{ range $containers }}
                    {{ if ne (.String "state") "running" }}
                      {{ $stopped = add $stopped 1 }}
                    {{ else if eq (.String "health") "unhealthy" }}
                      {{ $unhealthy = add $unhealthy 1 }}
                    {{ else }}
                      {{ $running = add $running 1 }}
                    {{ end }}
                  {{ end }}

                  {{ if $envName }}
                    <div class="size-h6 color-subdue" style="margin-top:0.5em;">{{ $envName }}</div>
                  {{ end }}

                  {{ $totalUp := add $running $unhealthy }}
                  <div class="flex items-center gap-5" style="margin-top:0.5em;">
                    {{ if eq $totalUp 0 }}
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" style="height:1.1em; stroke:currentColor; fill:none;">
                        <path d="M12 2v10"/>
                        <path d="M18.4 6.6a9 9 0 1 1-12.77.04"/>
                      </svg>
                      <span class="size-h6 color-negative">No containers running</span>
                    {{ else if gt $unhealthy 0 }}
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" style="height:1.1em; stroke:currentColor; fill:none;">
                        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
                        <path d="M12 9v4"/>
                        <path d="M12 17h.01"/>
                      </svg>
                      <span class="size-h6 color-negative">{{ $unhealthy }} container{{ if gt $unhealthy 1 }}s{{ end }} unhealthy</span>
                    {{ else }}
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" style="height:1.1em; stroke:currentColor; fill:none;">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="m8 12.5 2.5 2.5 5-5"/>
                      </svg>
                      <span class="size-h6 color-positive">All containers healthy</span>
                    {{ end }}
                  </div>

                  <div style="display:flex; justify-content:space-between; gap:12px; margin-top:0.5em;">

                    <div data-popover-type="html" data-popover-position="below" data-popover-margin="0.2rem"
                         style="flex:1; display:flex; flex-direction:column; align-items:center;">
                      <div class="size-h3 color-highlight">{{ $running }}</div>
                      <div data-popover-html="">
                        <div style="margin-bottom:0.75rem;">Running containers</div>
                        {{ range $containers }}
                          {{ if and (eq (.String "state") "running") (ne (.String "health") "unhealthy") }}
                            <div style="display:flex; justify-content:space-between; gap:1rem; min-width:220px;">
                              <div class="size-h5 text-compact">{{ .String "name" }}</div>
                              <div class="size-h5 color-subdue">{{ .String "image" }}</div>
                            </div>
                          {{ end }}
                        {{ end }}
                        {{ if eq $running 0 }}
                          <div class="size-h5 color-subdue">None</div>
                        {{ end }}
                      </div>
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" style="{{ $iconStyle }}">
                        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
                        <path d="m3.3 7 8.7 5 8.7-5"/>
                        <path d="M12 22V12"/>
                        <polygon points="16,12.75 16,22 24.25,17.875" fill="#22c55e" stroke="none"/>
                      </svg>
                    </div>

                    <div data-popover-type="html" data-popover-position="below" data-popover-margin="0.2rem"
                         style="flex:1; display:flex; flex-direction:column; align-items:center;">
                      <div class="size-h3 color-highlight">{{ $stopped }}</div>
                      <div data-popover-html="">
                        <div style="margin-bottom:0.75rem;">Stopped containers</div>
                        {{ range $containers }}
                          {{ if ne (.String "state") "running" }}
                            <div style="display:flex; justify-content:space-between; gap:1rem; min-width:220px;">
                              <div class="size-h5 text-compact">{{ .String "name" }}</div>
                              <div class="size-h5 color-subdue">{{ .String "status" }}</div>
                            </div>
                          {{ end }}
                        {{ end }}
                        {{ if eq $stopped 0 }}
                          <div class="size-h5 color-subdue">None</div>
                        {{ end }}
                      </div>
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" style="{{ $iconStyle }}">
                        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
                        <path d="m3.3 7 8.7 5 8.7-5"/>
                        <path d="M12 22V12"/>
                        <rect x="16.0" y="13.75" width="8.25" height="8.25" fill="#ef4444" stroke="none" />
                      </svg>
                    </div>

                    <div data-popover-type="html" data-popover-position="below" data-popover-margin="0.2rem"
                         style="flex:1; display:flex; flex-direction:column; align-items:center;">
                      <div class="size-h3 color-highlight">{{ $unhealthy }}</div>
                      <div data-popover-html="">
                        <div style="margin-bottom:0.75rem;">Unhealthy containers</div>
                        {{ range $containers }}
                          {{ if and (eq (.String "state") "running") (eq (.String "health") "unhealthy") }}
                            <div style="display:flex; justify-content:space-between; gap:1rem; min-width:220px;">
                              <div class="size-h5 text-compact">{{ .String "name" }}</div>
                              <div class="size-h5 color-subdue">{{ .String "status" }}</div>
                            </div>
                          {{ end }}
                        {{ end }}
                        {{ if eq $unhealthy 0 }}
                          <div class="size-h5 color-subdue">None</div>
                        {{ end }}
                      </div>
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" style="{{ $iconStyle }}">
                        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
                        <path d="m3.3 7 8.7 5 8.7-5"/>
                        <path d="M12 22V12"/>
                        <circle cx="20.125" cy="17.5" r="4.25" fill="#f59e0b" stroke="none"/>
                      </svg>
                    </div>

                    <div data-popover-type="html" data-popover-margin="0.2rem" data-popover-position="below"
                         style="flex:1; display:flex; flex-direction:column; align-items:center;">
                      <div data-popover-html="">
                        <div style="margin-bottom:0.75rem;">Pending updates</div>
                        {{ range $pendingUpdates }}
                          <div style="display:flex; justify-content:space-between; gap:1rem; min-width:220px;">
                            <div class="size-h5 text-compact">{{ .String "containerName" }}</div>
                            <div class="size-h5 color-subdue">{{ .String "currentImage" }}</div>
                          </div>
                        {{ end }}
                        {{ if eq (len $pendingUpdates) 0 }}
                          <div class="size-h5 color-subdue">Everything up to date</div>
                        {{ end }}
                      </div>
                      <div class="size-h3 {{ if gt (len $pendingUpdates) 0 }}color-negative{{ else }}color-highlight{{ end }}">{{ len $pendingUpdates }}</div>
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" style="{{ $iconStyle }}">
                        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                        <path d="M16 16h5v5"/>
                      </svg>
                    </div>

                  </div>

                  <div style="display:flex; justify-content:space-between; gap:12px; margin-top:0.75em; padding-top:0.75em; border-top: 1px solid var(--color-separator);">

                    <div data-popover-type="html" data-popover-position="below"
                        data-popover-margin="0.2rem"
                        style="flex:1; display:flex; flex-direction:column; align-items:center;">

                      <div class="size-h4 color-subdue">{{ len $images }}</div>
                      <div data-popover-html="">
                        <div style="margin-bottom:0.75rem;">Images</div>

                        {{ $unused := 0 }}
                        {{ $totalBytes := 0 }}
                        {{ range $images }}
                          {{ if eq (.Int "containers") 0 }}
                            {{ $unused = add $unused 1 }}
                          {{ end }}
                          {{ $totalBytes = add $totalBytes (.Int "size") }}
                        {{ end }}

                        {{ $totalGB := div $totalBytes 1073741824 }}
                        {{ $decimal := mod (div $totalBytes 1048576) 1024 }}

                        <div style="display:flex; justify-content:space-between; gap:0.5rem;">
                          <div>Unused images: </div>
                          <div class="color-highlight">{{ $unused }}</div>
                        </div>
                        <div style="display:flex; justify-content:space-between; gap:0.5rem;">
                          <div>Total size:</div>
                          <div class="color-highlight">{{ printf "%d.%02d GB" $totalGB $decimal }}</div>
                        </div>
                      </div>
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" style="{{ $iconStyleSmall }} margin-top:0.25rem;">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <path d="M21 15l-5-5L5 21"/>
                      </svg>
                    </div>

                    <div data-popover-type="text" data-popover-text="Volumes"
                         style="flex:1; display:flex; flex-direction:column; align-items:center;">
                      <div class="size-h4 color-subdue">{{ len $volumes }}</div>
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" style="{{ $iconStyleSmall }}">
                        <ellipse cx="12" cy="5" rx="9" ry="3"/>
                        <path d="M3 5V19A9 3 0 0 0 21 19V5"/>
                        <path d="M3 12A9 3 0 0 0 21 12"/>
                      </svg>
                    </div>

                    <div data-popover-type="html" data-popover-margin="0.2rem" data-popover-position="below"
                         style="flex:1; display:flex; flex-direction:column; align-items:center;">
                      <div data-popover-html="">
                        <div style="margin-bottom:0.75rem;">Networks</div>
                        {{ range $networks }}
                          <div style="display:flex; justify-content:space-between; gap:1rem; min-width:220px;">
                            <div class="size-h5 text-compact">{{ .String "name" }}</div>
                            <div class="size-h5 color-highlight">
                              {{ $cfg := .Array "ipam.config" }}
                              {{ if gt (len $cfg) 0 }}
                                {{ (index $cfg 0).String "subnet" }}
                              {{ else }}
                                &#x2014;
                              {{ end }}
                            </div>
                          </div>
                        {{ end }}
                      </div>
                      <div class="size-h4 color-subdue">{{ len $networks }}</div>
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" style="{{ $iconStyleSmall }}">
                        <rect x="16" y="16" width="6" height="6" rx="1"/>
                        <rect x="2" y="16" width="6" height="6" rx="1"/>
                        <rect x="9" y="2" width="6" height="6" rx="1"/>
                        <path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/>
                        <path d="M12 12V8"/>
                      </svg>
                    </div>

                    <div data-popover-type="html" data-popover-position="below" data-popover-margin="0.2rem"
                         style="flex:1; display:flex; flex-direction:column; align-items:center;">
                      <div class="size-h4 color-subdue">{{ len $stacks }}</div>
                      <div data-popover-html="">
                        <div style="margin-bottom:0.75rem;">Stacks</div>

                        {{ $runningStacks := 0 }}
                        {{ range $stacks }}{{ if eq (.String "status") "running" }}{{ $runningStacks = add $runningStacks 1 }}{{ end }}{{ end }}
                        {{ if gt $runningStacks 0 }}
                          <div class="size-h6 color-subdue" style="margin-top:0.5rem;">running</div>
                          {{ range $stacks }}
                            {{ if eq (.String "status") "running" }}
                              <div class="size-h5 text-compact" style="min-width:220px;">{{ .String "name" }}</div>
                            {{ end }}
                          {{ end }}
                        {{ end }}

                        {{ $partialStacks := 0 }}
                        {{ range $stacks }}{{ if eq (.String "status") "partial" }}{{ $partialStacks = add $partialStacks 1 }}{{ end }}{{ end }}
                        {{ if gt $partialStacks 0 }}
                          <div class="size-h6 color-negative" style="margin-top:0.5rem;">partial</div>
                          {{ range $stacks }}
                            {{ if eq (.String "status") "partial" }}
                              <div class="size-h5 text-compact" style="min-width:220px;">{{ .String "name" }}</div>
                            {{ end }}
                          {{ end }}
                        {{ end }}

                        {{ $stoppedStacks := 0 }}
                        {{ range $stacks }}{{ if eq (.String "status") "stopped" }}{{ $stoppedStacks = add $stoppedStacks 1 }}{{ end }}{{ end }}
                        {{ if gt $stoppedStacks 0 }}
                          <div class="size-h6 color-subdue" style="margin-top:0.5rem;">stopped</div>
                          {{ range $stacks }}
                            {{ if eq (.String "status") "stopped" }}
                              <div class="size-h5 text-compact" style="min-width:220px;">{{ .String "name" }}</div>
                            {{ end }}
                          {{ end }}
                        {{ end }}

                        {{ $createdStacks := 0 }}
                        {{ range $stacks }}{{ if eq (.String "status") "created" }}{{ $createdStacks = add $createdStacks 1 }}{{ end }}{{ end }}
                        {{ if gt $createdStacks 0 }}
                          <div class="size-h6 color-subdue" style="margin-top:0.5rem;">created</div>
                          {{ range $stacks }}
                            {{ if eq (.String "status") "created" }}
                              <div class="size-h5 text-compact" style="min-width:220px;">{{ .String "name" }}</div>
                            {{ end }}
                          {{ end }}
                        {{ end }}

                        {{ if eq (len $stacks) 0 }}
                          <div class="size-h5 color-subdue">None</div>
                        {{ end }}
                      </div>
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" style="{{ $iconStyleSmall }}">
                        <path d="M12 2 3 7l9 5 9-5-9-5z"/>
                        <path d="M3 12l9 5 9-5"/>
                        <path d="M3 17l9 5 9-5"/>
                      </svg>
                    </div>

                  </div>

              - type: custom-api
                title: Recently Watched
                options:
                  size: "small"
                  collapse: 5
                cache: 5m
                url: http://tautulli:8181/api/v2?apikey=${TAUTULLI_API_KEY}&cmd=get_home_stats&stat_id=last_watched
                template: |
                  {{ $isLarge := eq (.Options.StringOr "size" "large") "large" }}
                  {{ $serverID := "${PLEX_SERVER_ID}" }}
                  {{ $uniqueID := "recently_watched" }}
                  {{ $collapse := .Options.IntOr "collapse" 5 }}

                  {{ if $isLarge }}
                    {{ $rows := .JSON.Array "response.data.rows" }}
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                      <!-- Left scroll arrow -->
                      <div id="scrollLeft-{{ $uniqueID }}" title="Scroll left"
                        onclick='document.getElementById("scrollContainer-{{ $uniqueID }}").scrollBy({ left: -150, behavior: "smooth" })'
                        style="flex: 0 0 2.5rem; height: 100px; display: flex; align-items: center; justify-content: center; background: var(--color-surface); cursor: pointer;">
                        <span class="color-primary" style="font-size: 1.5rem; opacity: 0.7;">&#x25c0;</span>
                      </div>

                      <!-- Scrollable content -->
                      <div id="scrollContainer-{{ $uniqueID }}"
                        style="display: flex; overflow-x: auto; gap: 1rem; padding-block: 0.5rem; scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none;">
                        {{ range $i, $v := $rows }}
                          {{ $mediaType := $v.String "media_type" }}
                          {{ $isEpisode := eq $mediaType "episode" }}
                          {{ $titleHover := "" }}
                            {{ if $isEpisode }}
                              {{ $titleHover = $v.String "grandchild_title" }}
                            {{ else }}
                              {{ $titleHover = $v.String "title" }}
                            {{ end }}
                          {{ $ratingKey := $v.String "rating_key" }}
                          {{ $thumb := $v.String "thumb" }}

                          <a href="https://app.plex.tv/desktop/#!/server/{{ $serverID }}/details?key=%2Flibrary%2Fmetadata%2F{{ $ratingKey }}"
                            target="_blank"
                            style="min-width: 160px; text-align: center; text-decoration: none;">
              
                            <div style="max-height: 225px; overflow: hidden; border-radius: 6px;">
                              <img src="http://${NAS_HOST}:8181/api/v2?apikey=${TAUTULLI_API_KEY}&cmd=pms_image_proxy&img={{ $thumb }}"
                                alt="thumb"
                                title="{{ $titleHover }}"
                                style="width: 100%; height: auto; object-fit: cover;" />
                            </div>

                            <!-- Media info -->
                            {{ if $isEpisode }}
                              <div class="color-highlight" title="{{ $v.String "grandparent_title" }}"
                                style="margin-top: 1rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">
                                {{ $v.String "grandparent_title" }}
                              </div>
                              <div class="color-highlight" title="{{ $titleHover }}"
                                style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">
                                S{{ $v.Int "parent_media_index" }}&#xb7;E{{ $v.Int "media_index" }}
                              </div>
                            {{ else }}
                              <div class="color-highlight" title="{{ $v.String "title" }}"
                                style="margin-top: 1rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">
                                {{ $v.String "title" }}
                              </div>
                              <div class="color-highlight"
                                style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">
                                {{ $v.Int "year" }}
                              </div>
                            {{ end }}

                            <div class="color-primary" style="font-size: 0.9em;">
                              <span title="{{ $v.String "player" }}">{{ $v.String "friendly_name" }}</span><br>
                              <span {{ parseRelativeTime "unix" ($v.String "last_watch") }}></span> ago
                            </div>
                          </a>
                        {{ end }}
                      </div>

                      <!-- Right scroll arrow -->
                      <div id="scrollRight-{{ $uniqueID }}" title="Scroll right"
                        onclick='document.getElementById("scrollContainer-{{ $uniqueID }}").scrollBy({ left: 150, behavior: "smooth" })'
                        style="flex: 0 0 2.5rem; height: 100px; display: flex; align-items: center; justify-content: center; background: var(--color-surface); cursor: pointer;">
                        <span class="color-primary" style="font-size: 1.5rem; opacity: 0.7;">&#x25b6;</span>
                      </div>
                    </div>

                  {{ else }}
                    <!-- Compact list version -->
                    <ul class="list collapsible-container" data-collapse-after="{{ $collapse }}">
                      {{ range $i, $v := .JSON.Array "response.data.rows" }}
                        {{ $mediaType := $v.String "media_type" }}
                        {{ $isEpisode := eq $mediaType "episode" }}
                        {{ $titleHover := "" }}
                          {{ if $isEpisode }}
                            {{ $titleHover = $v.String "grandchild_title" }}
                          {{ else }}
                            {{ $titleHover = $v.String "title" }}
                          {{ end }}
                        {{ $ratingKey := $v.String "rating_key" }}
                        {{ $thumb := $v.String "thumb" }}

                        <li class="flex items-center gap-2" style="padding: 0.5rem 0; border-bottom: 1px solid var(--color-border);">
                          <img src="http://${NAS_HOST}:8181/api/v2?apikey=${TAUTULLI_API_KEY}&cmd=pms_image_proxy&img={{ $thumb }}"
                            alt="thumb"
                            class="rounded w-10 h-10 object-cover"
                            style="width: 50px; margin-right: 1.5rem;" />
                          <div class="min-width-0 grow">
                            {{ if $isEpisode }}
                              <div class="color-highlight" title="{{ $v.String "grandparent_title" }}"
                                style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">
                                {{ $v.String "grandparent_title" }}
                              </div>
                              <div class="color-highlight" title="{{ $titleHover }}">
                                S{{ $v.Int "parent_media_index" }}&#xb7;E{{ $v.Int "media_index" }}
                              </div>
                            {{ else }}
                              <div class="color-highlight" title="{{ $v.String "title" }}"
                                style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">
                                {{ $v.String "title" }}
                              </div>
                              <div class="color-highlight"
                                style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">
                                {{ $v.Int "year" }}
                              </div>
                            {{ end }}
                            <div class="color-primary">
                              <span title="{{ $v.String "player" }}">{{ $v.String "friendly_name" }}</span> &#x2022; 
                              <span {{ parseRelativeTime "unix" ($v.String "last_watch") }}></span> ago
                            </div>
                          </div>
                          <a href="https://app.plex.tv/desktop/#!/server/{{ $serverID }}/details?key=%2Flibrary%2Fmetadata%2F{{ $ratingKey }}"
                            target="_blank"
                            class="color-primary">&#x25b6;</a>
                        </li>
                      {{ end }}
                    </ul>
                  {{ end }}

              # Needs a remotely managed tunnel (token based) and an API token with
              # Account > Cloudflare Tunnel > Read.
              - type: custom-api
                title: Cloudflare Tunnel
                css-class: "widget-type-cloudflared"
                cache: 4h
                url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/cfd_tunnel/${CLOUDFLARE_TUNNEL_ID}/configurations
                headers:
                  Authorization: Bearer ${CLOUDFLARE_API_TOKEN}
                template: |

                  <style>
                    .widget-type-cloudflared li {
                      margin-top: var(--list-half-gap); 
                      border-top: 1px solid var(--color-separator);
                      padding-top: var(--list-half-gap);
                    }
                  </style>
                  <ul class="dynamic-columns list-gap-15 list-with-separator">
                  {{ range .JSON.Array "result.config.ingress" }}
                    {{ if (.String "hostname") }}
                    <li class="flex items-center gap-20">
                        <div class="shrink-0">
                            <img class="docker-container-icon" src="https://developers.cloudflare.com/logo.svg" alt="" loading="lazy">
                        </div>
                        <div class="min-width-0 grow">
                          <a href='https://{{ .String "hostname" }}' class="color-highlight size-title-dynamic block text-truncate" target="_blank" rel="noreferrer">{{ .String "hostname" }}</a>
                          {{ if (.String "service") }}
                          <div class="flex items-center gap-10" style="margin-bottom: 5px">
                            <div class="text-left color-subdue">&#x21b3;</div>
                            <div class="size-h6 flex-1 text-left">
                              <span class="color-subdue">{{ .String "service" }}</span>
                            </div>
                          </div>
                          {{ end}}
                        </div>
                    </li>
                    {{ end }}
                  {{ end }}
                  </ul>

          - type: custom-api
            title: Unread
            title-url: http://${NAS_HOST}:8071
            cache: 10m
            url: http://miniflux:8080/v1/entries?status=unread&order=published_at&direction=desc&limit=20
            headers:
              X-Auth-Token: ${MINIFLUX_API_KEY}
            template: |
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="6">
                {{ range .JSON.Array "entries" }}
                <li>
                  <a class="size-title-dynamic color-primary-if-not-visited" href="{{ .String "url" }}" target="_blank" rel="noreferrer">{{ .String "title" }}</a>
                  <ul class="list-horizontal-text">
                    <li>{{ .String "feed.title" }}</li>
                    <li {{ .String "published_at" | parseTime "rfc3339" | toRelativeTime }}></li>
                  </ul>
                </li>
                {{ else }}
                <li class="color-subdue">Inbox zero.</li>
                {{ end }}
              </ul>

  - name: Media
    columns:
      - size: small
        widgets:
          - type: custom-api
            title: Sonarr Stats
            cache: 2s
            url: http://sonarr:8989/api/v3/series?apikey=${SONARR_API_KEY}
            subrequests:
              missing:
                url: http://sonarr:8989/api/v3/wanted/missing?apikey=${SONARR_API_KEY}
              queue:
                url: http://sonarr:8989/api/v3/queue?apikey=${SONARR_API_KEY}
            template: |
              <div class="flex justify-between text-center">
                <div>
                  <div class="color-highlight size-h3">{{ len (.JSON.Array "") }}</div>
                  <div class="size-h6">SERIES</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ (.Subrequest "missing").JSON.Int "totalRecords" }}</div>
                  <div class="size-h6">MISSING</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ (.Subrequest "queue").JSON.Int "totalRecords" }}</div>
                  <div class="size-h6">QUEUED</div>
                </div>
              </div>

          - type: custom-api
            title: Radarr Stats
            cache: 2s
            url: http://radarr:7878/api/v3/movie?apikey=${RADARR_API_KEY}
            subrequests:
              missing:
                url: http://radarr:7878/api/v3/wanted/missing?apikey=${RADARR_API_KEY}
              queue:
                url: http://radarr:7878/api/v3/queue?apikey=${RADARR_API_KEY}
            template: |
              <div class="flex justify-between text-center">
                <div>
                  <div class="color-highlight size-h3">{{ len (.JSON.Array "") }}</div>
                  <div class="size-h6">MOVIES</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ (.Subrequest "missing").JSON.Int "totalRecords" }}</div>
                  <div class="size-h6">MISSING</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ (.Subrequest "queue").JSON.Int "totalRecords" }}</div>
                  <div class="size-h6">QUEUED</div>
                </div>
              </div>

          - type: custom-api
            title: Prowlarr Indexers
            cache: 1m
            options:
              url: "http://${NAS_HOST}:9696"
              base-url: http://prowlarr:9696
              api-key: ${PROWLARR_API_KEY}
              collapse-after: 5
            template: |
              {{ $apiBaseUrl := .Options.StringOr "base-url" "" }}
              {{ $key := .Options.StringOr "api-key" "" }}
              {{ $url := .Options.StringOr "url" "" }}
              {{ $collapseAfter := .Options.IntOr "collapse-after" 5 }}

              {{ if or (eq $apiBaseUrl "") (eq $key "") (eq $url "") }}
                <div class="widget-error-header">
                    <div class="color-negative size-h3">ERROR</div>
                    <svg class="widget-error-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"></path>
                    </svg>
                  </div>
                  <p class="break-all">
                    Some options are not set or malformed
                      <table style="border-spacing: 1rem;">
                        <tr>
                          <td><strong>PROWLARR_URL & PROWLARR_API_URL</strong> <br/> should include http(s):// and port if needed</td>
                        </tr>
                        <tr>
                          <td><strong>PROWLARR_KEY</strong> <br/> must be set (Settings > General > Security)</td>
                        </tr>
                      </table> 
                  </p>
              {{ else }}

                {{ $indexUrl := printf "%s/api/v1/indexer" $apiBaseUrl }}

                {{ $indexData := newRequest $indexUrl
                  | withHeader "Accept" "application/json"
                  | withHeader "X-Api-Key" $key
                  | getResponse }}

                {{ if eq $indexData.Response.StatusCode 200 }}
                  <style>
                    .prowlarr-indexers .prowlarr-index-item
                    {
                      align-items: center;        
                    }
                    .prowlarr-indexers .prowlarr-index-item > span{
                      text-transform: capitalize;
                      background: var(--color-background);
                      padding: 0.2rem 0.75rem;
                      border: 1px solid var(--color-widget-content-border);
                      border-radius: var(--border-radius);
                      font-size: var(--font-size-tiny);
                    }
                  </style>
  
                  <ul class="prowlarr-indexers list list-gap-10 collapsible-container" data-collapse-after="{{ $collapseAfter }}">

                    {{ range $indexData.JSON.Array "" }}
                      {{ $isEnabled := .String "enable" }}
      
                      <li class="flex items-center gap-12 prowlarr-index-item">
                        <a href="{{ $url }}" target="_blank" class="size-title-dynamic color-highlight text-truncate block grow">{{ .String "name" }}</a>
                        <span>{{ .String "privacy" }}</span>
                        {{ if eq $isEnabled "true" }}
                          <div class="margin-left-auto shrink-0" data-popover-type="text" data-popover-position="above" data-popover-text="Enabled" aria-label="Enabled">
                            <div class="monitor-site-status-icon-compact" title="Enabled">
                              <svg fill="var(--color-positive)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd"></path>
                              </svg>
                            </div>
                          </div>
                        {{ else }}
                          <div class="margin-left-auto shrink-0" data-popover-type="text" data-popover-position="above" data-popover-text="Disabled" aria-label="Disabled">
                            <div class="monitor-site-status-icon-compact" title="Disabled">
                              <svg fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd"></path>
                              </svg>
                            </div>
                          </div>
                        {{ end }}
              
                      </li>
                    {{ end }}

                  </ul>
                {{ else }}
                  <p>Failed to fetch data (Status: {{ $indexData.Response.StatusCode }})</p>
                {{ end }}

              {{ end }}

      - size: full
        widgets:
          - type: group
            widgets:
              - type: custom-api
                title: Upcoming TV
                title-url: http://${NAS_HOST}:8989
                cache: 30m
                options:
                  service: sonarr
                  type: upcoming
                  size: medium
                  collapse-after: 4
                  interval: 30
                  sort-time: asc
                  api-base-url: http://sonarr:8989
                  url: http://${NAS_HOST}:8989
                  key: ${SONARR_API_KEY}
                template: *arr-releases
              - type: custom-api
                title: Upcoming Movies
                title-url: http://${NAS_HOST}:7878
                cache: 30m
                options:
                  service: radarr
                  type: upcoming
                  size: medium
                  collapse-after: 4
                  interval: 30
                  sort-time: asc
                  api-base-url: http://radarr:7878
                  url: http://${NAS_HOST}:7878
                  key: ${RADARR_API_KEY}
                template: *arr-releases
              - type: custom-api
                title: Upcoming Music
                title-url: http://${NAS_HOST}:8686
                cache: 30m
                options:
                  service: lidarr
                  type: upcoming
                  size: medium
                  collapse-after: 4
                  interval: 30
                  sort-time: asc
                  api-base-url: http://lidarr:8686
                  url: http://${NAS_HOST}:8686
                  key: ${LIDARR_API_KEY}
                template: *arr-releases

          # Missing music is left out: Lidarr counts every unowned album of
          # every monitored artist, so that list is huge.
          - type: group
            widgets:
              - type: custom-api
                title: Grabbed TV
                title-url: http://${NAS_HOST}:8989
                cache: 30m
                options:
                  service: sonarr
                  type: recent
                  size: medium
                  collapse-after: 4
                  interval: 14
                  api-base-url: http://sonarr:8989
                  url: http://${NAS_HOST}:8989
                  key: ${SONARR_API_KEY}
                template: *arr-releases
              - type: custom-api
                title: Grabbed Movies
                title-url: http://${NAS_HOST}:7878
                cache: 30m
                options:
                  service: radarr
                  type: recent
                  size: medium
                  collapse-after: 4
                  interval: 14
                  api-base-url: http://radarr:7878
                  url: http://${NAS_HOST}:7878
                  key: ${RADARR_API_KEY}
                template: *arr-releases
              - type: custom-api
                title: Grabbed Music
                title-url: http://${NAS_HOST}:8686
                cache: 30m
                options:
                  service: lidarr
                  type: recent
                  size: medium
                  collapse-after: 4
                  interval: 14
                  api-base-url: http://lidarr:8686
                  url: http://${NAS_HOST}:8686
                  key: ${LIDARR_API_KEY}
                template: *arr-releases
              - type: custom-api
                title: Missing TV
                title-url: http://${NAS_HOST}:8989
                cache: 30m
                options:
                  service: sonarr
                  type: missing
                  size: medium
                  collapse-after: 4
                  api-base-url: http://sonarr:8989
                  url: http://${NAS_HOST}:8989
                  key: ${SONARR_API_KEY}
                template: *arr-releases
              - type: custom-api
                title: Missing Movies
                title-url: http://${NAS_HOST}:7878
                cache: 30m
                options:
                  service: radarr
                  type: missing
                  size: medium
                  collapse-after: 4
                  api-base-url: http://radarr:7878
                  url: http://${NAS_HOST}:7878
                  key: ${RADARR_API_KEY}
                template: *arr-releases

          - type: custom-api
            title: Recently Added
            cache: 5m
            url: http://tautulli:8181/api/v2?apikey=${TAUTULLI_API_KEY}&cmd=get_recently_added&count=10
            options:
              size: "large" 
              collapse: 5
            template: |
              {{ $isLarge := eq (.Options.StringOr "size" "large") "large" }}
              {{ $serverID := "${PLEX_SERVER_ID}" }}
              {{ $uniqueID := "recently_added" }}
              {{ $collapse := .Options.IntOr "collapse" 5 }}
              {{ $rows := .JSON.Array "response.data.recently_added" }}

              {{ if $isLarge }}
                <!-- Large View -->
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                  <!-- Left Arrow -->
                  <div id="scrollLeft-{{ $uniqueID }}" onclick='document.getElementById("scrollContainer-{{ $uniqueID }}").scrollBy({ left: -150, behavior: "smooth" })'
                    style="flex: 0 0 2.5rem; height: 100px; display: flex; align-items: center; justify-content: center; background: var(--color-surface); cursor: pointer;">
                    <span class="color-primary" style="font-size: 1.5rem; opacity: 0.7;">&#x25c0;</span>
                  </div>

                  <!-- Scroll Content -->
                  <div id="scrollContainer-{{ $uniqueID }}"
                    style="display: flex; overflow-x: auto; gap: 1rem; padding-block: 0.5rem; scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none;">
                    {{ range $i, $v := $rows }}
                      {{ $type := $v.String "media_type" }}
                      {{ $isEpisode := eq $type "episode" }}
                      {{ $isMovie := eq $type "movie" }}
                      {{ $isSeason := eq $type "season" }}
                      {{ $isShow := eq $type "show" }}
                      {{ $ratingKey := $v.String "rating_key" }}
                      {{ $lastWatch := printf "%d" ($v.Int "added_at") }}

                      {{ $img := "" }}
                      {{ $title := "" }}
                      {{ $sub := "" }}

                      {{ if $isEpisode }}
                        {{ $img = $v.String "grandparent_thumb" }}
                        {{ $title = $v.String "grandparent_title" }}
                        {{ $sub = printf "S%d \u00b7 E%d" ($v.Int "parent_media_index") ($v.Int "media_index") }}
                      {{ else if $isMovie }}
                        {{ $img = $v.String "thumb" }}
                        {{ $title = $v.String "title" }}
                        {{ $sub = printf "%d" ($v.Int "year") }}
                      {{ else if $isSeason }}
                        {{ $img = $v.String "parent_thumb" }}
                        {{ $title = $v.String "parent_title" }}
                        {{ $sub = $v.String "title" }}
                      {{ else if $isShow }}
                        {{ $img = $v.String "thumb" }}
                        {{ $title = $v.String "title" }}
                        {{ $sub = printf "%d" ($v.Int "year") }}
                      {{ else }}
                        {{ $img = $v.String "thumb" }}
                        {{ $title = $v.String "title" }}
                        {{ $sub = $v.String "parent_title" }}
                      {{ end }}

                      <a href="https://app.plex.tv/desktop/#!/server/{{ $serverID }}/details?key=%2Flibrary%2Fmetadata%2F{{ $ratingKey }}" target="_blank"
                        style="min-width: 160px; text-align: center; text-decoration: none;">
                        <div style="max-height: 225px; overflow: hidden; border-radius: 6px;">
                          <img src="http://${NAS_HOST}:8181/api/v2?apikey=${TAUTULLI_API_KEY}&cmd=pms_image_proxy&img={{ $img }}"
                            alt="thumb" title="{{ $title }}"
                            style="width: 100%; height: auto; object-fit: cover;" />
                        </div>
                        <div class="color-highlight" style="margin-top: 1rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;" title="{{ $title }}">
                          {{ $title }}
                        </div>
                        <div class="color-highlight" style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">
                          {{ $sub }}
                        </div>
                        <div class="color-primary" style="font-size: 0.9em;">
                          <span {{ parseRelativeTime "unix" $lastWatch }}></span> ago
                        </div>
                      </a>
                    {{ end }}
                  </div>

                  <!-- Right Arrow -->
                  <div id="scrollRight-{{ $uniqueID }}"
                    onclick='document.getElementById("scrollContainer-{{ $uniqueID }}").scrollBy({ left: 150, behavior: "smooth" })'
                    style="flex: 0 0 2.5rem; height: 100px; display: flex; align-items: center; justify-content: center; background: var(--color-surface); cursor: pointer;">
                    <span class="color-primary" style="font-size: 1.5rem; opacity: 0.7;">&#x25b6;</span>
                  </div>
                </div>
              {{ else }}
                <!-- Small View -->
                <ul class="list collapsible-container" data-collapse-after="{{ $collapse }}">
                  {{ range $i, $v := $rows }}
                    {{ $type := $v.String "media_type" }}
                    {{ $isEpisode := eq $type "episode" }}
                    {{ $isMovie := eq $type "movie" }}
                    {{ $isSeason := eq $type "season" }}
                    {{ $isShow := eq $type "show" }}
                    {{ $ratingKey := $v.String "rating_key" }}
                    {{ $lastWatch := printf "%d" ($v.Int "added_at") }}

                    {{ $img := "" }}
                    {{ $title := "" }}
                    {{ $sub := "" }}

                    {{ if $isEpisode }}
                      {{ $img = $v.String "grandparent_thumb" }}
                      {{ $title = $v.String "grandparent_title" }}
                      {{ $sub = printf "S%d \u00b7 E%d" ($v.Int "parent_media_index") ($v.Int "media_index") }}
                    {{ else if $isMovie }}
                      {{ $img = $v.String "thumb" }}
                      {{ $title = $v.String "title" }}
                      {{ $sub = printf "%d" ($v.Int "year") }}
                    {{ else if $isSeason }}
                      {{ $img = $v.String "parent_thumb" }}
                      {{ $title = $v.String "parent_title" }}
                      {{ $sub = $v.String "title" }}
                    {{ else if $isShow }}
                      {{ $img = $v.String "thumb" }}
                      {{ $title = $v.String "title" }}
                      {{ $sub = printf "%d" ($v.Int "year") }}
                    {{ else }}
                      {{ $img = $v.String "thumb" }}
                      {{ $title = $v.String "title" }}
                      {{ $sub = $v.String "parent_title" }}
                    {{ end }}

                    <li class="flex items-center gap-2" style="padding: 0.5rem 0; border-bottom: 1px solid var(--color-border);">
                      <img src="http://${NAS_HOST}:8181/api/v2?apikey=${TAUTULLI_API_KEY}&cmd=pms_image_proxy&img={{ $img }}" 
                        alt="thumb" style="width: 50px; margin-right: 1.5rem;" class="rounded w-10 h-10 object-cover" />
                      <div class="min-width-0 grow">
                        <div class="color-highlight" style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis;" title="{{ $title }}">
                          {{ $title }}
                        </div>
                        <div class="color-highlight" style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">
                          {{ $sub }}
                        </div>
                        <div class="color-primary">
                          <span {{ parseRelativeTime "unix" $lastWatch }}></span> ago
                        </div>
                      </div>
                      <a href="https://app.plex.tv/desktop/#!/server/{{ $serverID }}/details?key=%2Flibrary%2Fmetadata%2F{{ $ratingKey }}" target="_blank"
                        class="color-primary">&#x25b6;</a>
                    </li>
                  {{ end }}
                </ul>
              {{ end }}
