set -g default-command ${SHELL}
set -g default-shell ${SHELL}

set -g default-terminal "screen-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-features ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind R source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded."

set -g mouse on
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
# set -g display-panes-time 1000
# set -g display-time 1000
set -g status-keys vi
set -g status-justify centre
set-window-option -g mode-keys vi
set-window-option -g automatic-rename on
set-window-option -g aggressive-resize on
# set -g status-interval 1

if-shell 'defaults read -g AppleInterfaceStyle >/dev/null 2>&1' \
  'set -g @ukiyo-theme "kanagawa/dragon"' \
  'set -g @ukiyo-theme "kanagawa/lotus"'
set -g @ukiyo-ignore-window-colors true
set -g @ukiyo-plugins "battery cpu-usage ram-usage"
set -g @ukiyo-show-powerline false
set -g @ukiyo-show-flags true
# set -g @ukiyo-continuum-mode time

set -g @resurrect-processes 'false'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'Nybkox/tmux-ukiyo'

# https://github.com/tmux-plugins/tmux-continuum#known-issues
# tmux-continuum must be last in TPM list, themes can overwrite status-right and break autosave
set -g @plugin 'tmux-plugins/tmux-continuum'

run '~/.tmux/plugins/tpm/tpm'
